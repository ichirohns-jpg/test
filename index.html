<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6EFE6" />
  <title>住まいと暮らしチェック（志木モデル）</title>
  <style>
    :root{
      --bg:#F6EFE6;
      --card:#FFFFFF;
      --text:#1F2937;
      --muted:#55606E;
      --line:#E7DCCF;
      --accent:#2B6CB0;
      --accent2:#2F855A;
      --warn:#B7791F;
      --softwarn:#FFF7E6;
      --danger:#9B2C2C;
      --soft:#FDF8F2;
      --shadow: 0 10px 30px rgba(31,41,55,0.08);
      --radius: 18px;
      --btnRadius: 16px;
      --tap: 56px;
      --tapLarge: 64px;
      --maxw: 860px;
      --font: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background: radial-gradient(1200px 700px at 30% -20%, #FFF 0%, var(--bg) 55%, #F2E6D8 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height:1.55;
      font-size: 18px;
    }

    @media (min-width: 420px){
      body{ font-size: 19px; }
    }
    @media (min-width: 820px){
      body{ font-size: 20px; }
    }

    a{ color: var(--accent); text-decoration: none; }
    a:hover{ text-decoration: underline; }

    .wrap{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding: 18px 16px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-top: calc(18px + env(safe-area-inset-top));
    }

    header{
      width:100%;
      max-width:var(--maxw);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2B6CB0 0%, #2F855A 100%);
      box-shadow: 0 10px 25px rgba(43,108,176,0.18);
      position:relative;
      flex: 0 0 auto;
    }
    .logo:before{
      content:"";
      position:absolute;
      inset:10px 12px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.88);
      transform: rotate(6deg);
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title h1{
      margin:0;
      font-size: 1.08em;
      letter-spacing: 0.02em;
      line-height:1.25;
    }
    .subtitle{
      margin:0;
      color:var(--muted);
      font-size: 0.92em;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 8px 18px rgba(31,41,55,0.06);
      color: var(--muted);
      font-size: 0.92em;
      white-space: nowrap;
    }
    .chip strong{ color: var(--text); font-weight: 700; }

    main{
      width:100%;
      max-width:var(--maxw);
      display:flex;
      flex-direction:column;
      gap:14px;
      flex: 1 1 auto;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }
    @media (min-width: 520px){
      .card{ padding: 22px 22px; }
    }

    .sectionTitle{
      margin:0 0 10px;
      font-size: 1.05em;
      letter-spacing: 0.01em;
    }

    .lead{
      margin: 0;
      color: var(--muted);
      font-size: 0.98em;
    }

    .notice{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid #E8D8C7;
      background: linear-gradient(180deg, #FFF 0%, var(--soft) 100%);
      color: #384152;
      font-size: 0.98em;
    }

    .divider{
      height:1px;
      background: var(--line);
      margin: 14px 0;
    }

    .btnRow{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top: 14px;
    }
    @media (min-width: 640px){
      .btnRow{
        flex-direction:row;
        align-items:stretch;
      }
    }

    button{
      font-family:inherit;
      cursor:pointer;
      border:none;
      border-radius: var(--btnRadius);
      min-height: var(--tapLarge);
      padding: 14px 14px;
      font-size: 1.05em;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform .06s ease, box-shadow .12s ease, background .12s ease, opacity .12s ease;
      outline: none;
      touch-action: manipulation;
    }
    button:active{
      transform: translateY(1px);
    }
    button:focus-visible{
      box-shadow: 0 0 0 4px rgba(43,108,176,0.25), 0 10px 25px rgba(31,41,55,0.08);
    }

    .btnPrimary{
      background: linear-gradient(135deg, #2B6CB0 0%, #1E4E8C 100%);
      color:#fff;
      box-shadow: 0 12px 28px rgba(43,108,176,0.22);
    }
    .btnPrimary:hover{ opacity: 0.96; }

    .btnYes{
      background: linear-gradient(135deg, #B7791F 0%, #9C5F12 100%);
      color:#fff;
      box-shadow: 0 12px 28px rgba(183,121,31,0.20);
    }

    .btnNo{
      background: linear-gradient(135deg, #2F855A 0%, #256A46 100%);
      color:#fff;
      box-shadow: 0 12px 28px rgba(47,133,90,0.18);
    }

    .btnGhost{
      background: rgba(255,255,255,0.75);
      border: 1px solid var(--line);
      color: var(--text);
      box-shadow: 0 10px 22px rgba(31,41,55,0.06);
      min-height: var(--tap);
      font-weight: 700;
    }

    .btnDangerGhost{
      background: rgba(255,255,255,0.75);
      border: 1px solid #E9C5C5;
      color: #7B1B1B;
      box-shadow: 0 10px 22px rgba(31,41,55,0.06);
      min-height: var(--tap);
      font-weight: 800;
    }

    .small{
      font-size: 0.92em;
      color: var(--muted);
    }

    .qHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #FFF;
      color: #3B4656;
      font-weight: 700;
      font-size: 0.90em;
      white-space: nowrap;
    }

    .progressWrap{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .progressTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .progressText{
      font-weight:800;
      letter-spacing:0.01em;
    }
    .progressHint{
      color: var(--muted);
      font-size: 0.92em;
      text-align:right;
    }
    .bar{
      width:100%;
      height: 14px;
      border-radius: 999px;
      background: #F2E7DA;
      border: 1px solid var(--line);
      overflow:hidden;
      box-shadow: inset 0 2px 6px rgba(31,41,55,0.06);
    }
    .bar > div{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2B6CB0 0%, #2F855A 55%, #B7791F 100%);
      transition: width .25s ease;
    }
    @media (prefers-reduced-motion: reduce){
      .bar > div{ transition: none; }
      button{ transition: none; }
    }

    .qText{
      margin: 10px 0 0;
      font-size: 1.15em;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .hintBox{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid #E2D2C1;
      background: #FFFDF9;
      color: #3B4656;
      font-size: 0.98em;
    }

    .twoCol{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 780px){
      .twoCol{
        grid-template-columns: 1.2fr 0.8fr;
        align-items:start;
      }
    }

    .resultHero{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .stateLabel{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 900;
      letter-spacing: 0.01em;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF8F0 100%);
    }
    .stateDot{
      width: 12px; height: 12px; border-radius: 999px; background: var(--accent2);
      box-shadow: 0 0 0 4px rgba(47,133,90,0.14);
      flex: 0 0 auto;
    }

    .metricBox{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding: 14px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #FFF;
    }
    .metricRow{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
    }
    .metricRow .k{
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95em;
    }
    .metricRow .v{
      font-weight: 900;
      font-size: 1.25em;
      letter-spacing: 0.01em;
    }
    .metricRow .v small{
      font-size: 0.72em;
      color: var(--muted);
      font-weight: 800;
    }

    .list{
      margin: 0;
      padding-left: 1.1em;
      color: #2B3442;
    }
    .list li{ margin: 8px 0; }

    .areaList{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 8px;
    }
    .areaItem{
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #FFF;
      padding: 12px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .areaTop{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:12px;
      flex-wrap: wrap;
    }
    .areaName{
      font-weight: 900;
      font-size: 1.02em;
    }
    .areaScore{
      color: var(--muted);
      font-weight: 900;
      font-size: 0.95em;
      white-space: nowrap;
    }
    .miniBar{
      width:100%;
      height: 12px;
      border-radius: 999px;
      border: 1px solid #EADDCF;
      background: #FAF2E8;
      overflow:hidden;
    }
    .miniBar > div{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2B6CB0 0%, #2F855A 60%, #B7791F 100%);
      transition: width .25s ease;
    }

    .areaDesc{
      margin:0;
      color:#384152;
      font-size: 0.96em;
    }

    .callGrid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    @media (min-width: 720px){
      .callGrid{ grid-template-columns: 1fr 1fr 1fr; }
    }
    .callCard{
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #FFF;
      padding: 14px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .callCard .name{
      font-weight: 900;
      letter-spacing: 0.01em;
    }
    .callCard a.tel{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height: var(--tapLarge);
      border-radius: 16px;
      background: linear-gradient(135deg, #2B6CB0 0%, #1E4E8C 100%);
      color: #fff;
      font-weight: 900;
      font-size: 1.08em;
      box-shadow: 0 12px 28px rgba(43,108,176,0.20);
      border: none;
      text-decoration:none;
      padding: 12px 12px;
    }
    .callCard a.tel:focus-visible{
      outline: none;
      box-shadow: 0 0 0 4px rgba(43,108,176,0.25), 0 10px 25px rgba(31,41,55,0.08);
    }

    .foot{
      width:100%;
      max-width:var(--maxw);
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.90em;
      text-align:center;
    }

    .srOnly{
      position:absolute;
      width:1px;height:1px;
      padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);
      white-space:nowrap;border:0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand" aria-label="アプリ名">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <h1>住まいと暮らしチェック（志木モデル）</h1>
          <p class="subtitle">変化に気づくための、やさしい30問</p>
        </div>
      </div>
      <div class="chip" id="topChip" aria-live="polite"><strong>準備中</strong></div>
    </header>

    <main id="app" aria-live="polite">
      <!-- screens injected -->
    </main>

    <div class="foot" id="footNote">
      ※これは医療の診断ではありません。気づきと相談につなぐためのチェックです。
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      const STORAGE_KEY = "shiki_model_check_v1";

      const DOMAIN_META = {
        house:   { name: "住宅・相続",          desc: "家の管理や将来の話し合い、書類の場所などは、後回しになるほど困りごとが増えやすい分野です。", weight: 1.2 },
        isolation:{ name: "人間関係・孤立",      desc: "頼れる人や話し相手が減ると、困りごとが表に出にくくなります。早めに「つながり」を作るのが大切です。", weight: 1.2 },
        life:    { name: "生活機能",            desc: "家事や外出が少しずつ大変になると、暮らしの幅が狭くなり、家の維持も難しくなりがちです。", weight: 1.0 },
        health:  { name: "健康",                desc: "疲れやすさ、食事、物忘れ、気分の落ち込み、薬の管理などは、暮らしと住まい全体に影響します。", weight: 1.2 },
        money:   { name: "お金",                desc: "支払い管理や将来費用の不安は、修繕や生活の判断を迷わせやすい分野です。小さく整理すると楽になります。", weight: 1.0 },
        ending:  { name: "終活",                desc: "連絡先・希望のメモ・荷物の整理などは、いざという時に家族や支援者が動きやすくなります。", weight: 1.0 }
      };

      const QUESTIONS = [
        { id: 1, domain:"house", text:"庭の手入れや外回りの片付けを、以前より負担に感じることがある" },
        { id: 2, domain:"house", text:"家の中に、数年以上使っていない部屋や物置状態の場所がある" },
        { id: 3, domain:"house", text:"この家を将来どうするか（譲る・売る等）について、家族との話し合いが不足している" },
        { id: 4, domain:"house", text:"家の権利証や土地の境界に関する書類が、どこにあるかすぐには分からない" },
        { id: 5, domain:"house", text:"今の家にあと何年住み続けるか、具体的なイメージが持てていない" },

        { id: 6, domain:"isolation", text:"近所に、ちょっとした困りごとを気軽に頼める相手がいない" },
        { id: 7, domain:"isolation", text:"家族や親戚と連絡を取り合うのは、数ヶ月に一度あるかないかだ" },
        { id: 8, domain:"isolation", text:"地域の行事や趣味の集まりなど、外出の機会が以前より減っている" },
        { id: 9, domain:"isolation", text:"1日のうち、誰とも一言も会話をしない日がよくある" },
        { id: 10, domain:"isolation", text:"体調が悪くなった時や困った時に、すぐ連絡できる相手がいない" },

        { id: 11, domain:"life", text:"重い買い物袋を持って歩くのが、以前より疲れやすくなった" },
        { id: 12, domain:"life", text:"部屋の段差やつまずきなど、家の作りが不便だと感じることが増えた" },
        { id: 13, domain:"life", text:"ゴミ出しや日々の掃除など、当たり前の家事が少し面倒になり始めている" },
        { id: 14, domain:"life", text:"電球交換や簡単な修繕など、家の維持管理を後回しにしている" },
        { id: 15, domain:"life", text:"以前に比べて、家の中で過ごす時間が長くなり、外に出るのが億劫（おっくう）だ" },

        { id: 16, domain:"health", text:"以前より「疲れが取れにくい」「体が重い」と感じることが増えた" },
        { id: 17, domain:"health", text:"食事の準備が面倒で、簡単なものや同じような献立で済ませがちだ" },
        { id: 18, domain:"health", text:"以前より、物忘れやうっかりが少し増えたと感じる" },
        { id: 19, domain:"health", text:"以前は楽しかった外出や趣味に対して、以前ほど関心が持てなくなった" },
        { id: 20, domain:"health", text:"毎日飲んでいる薬の数が増えて、飲み忘れや管理に不安を感じ始めている" },

        { id: 21, domain:"money", text:"通帳の記帳や、光熱費・税金の支払い管理を少し負担に感じている" },
        { id: 22, domain:"money", text:"屋根や水回りの修理など、家の維持にかかる将来の費用が不安だ" },
        { id: 23, domain:"money", text:"将来、入院や施設入所が必要になった時の費用について、目処が立っていない" },
        { id: 24, domain:"money", text:"通帳や印鑑の保管場所を、自分以外の誰も把握していない" },
        { id: 25, domain:"money", text:"知らない電話や訪問販売など、お金のトラブルが自分にも起きそうで怖い" },

        { id: 26, domain:"ending", text:"急に体調を崩した時の「第一連絡先」を、家族や周囲と共有できていない" },
        { id: 27, domain:"ending", text:"家にある荷物や家財道具の整理が、まだあまり進んでいない" },
        { id: 28, domain:"ending", text:"自分の希望（医療や介護、家の処分等）を書き残したものが、まだ何もない" },
        { id: 29, domain:"ending", text:"体力が落ちたとき、今の家に住み続けるか住み替えるかの判断を先送りにしている" },
        { id: 30, domain:"ending", text:"これからの自分や家のことについて、気軽に相談できる専門家や知人がいない" }
      ];

      const appEl = document.getElementById("app");
      const topChip = document.getElementById("topChip");

      const state = {
        screen: "start",     // start | question | result
        index: 0,            // 0..29
        answers: new Array(QUESTIONS.length).fill(null), // null | 0 | 1
        startedAt: null
      };

      function safeText(s){
        return String(s).replace(/[&<>"']/g, (c)=>({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        }[c]));
      }

      function saveState(){
        try{
          const payload = {
            screen: state.screen,
            index: state.index,
            answers: state.answers,
            startedAt: state.startedAt
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        }catch(e){}
      }

      function loadState(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) return false;
          const data = JSON.parse(raw);
          if(!data || !Array.isArray(data.answers) || data.answers.length !== QUESTIONS.length) return false;
          state.screen = data.screen || "start";
          state.index = Number.isFinite(data.index) ? data.index : 0;
          state.answers = data.answers.map(v => (v===0 || v===1) ? v : null);
          state.startedAt = data.startedAt || null;

          if(state.screen === "question"){
            if(state.index < 0) state.index = 0;
            if(state.index >= QUESTIONS.length) state.index = QUESTIONS.length - 1;
          }
          if(state.screen === "result"){
            if(state.answers.some(v => v === null)) state.screen = "question";
          }
          return true;
        }catch(e){
          return false;
        }
      }

      function clearState(){
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      }

      function updateTopChip(){
        if(state.screen === "start"){
          topChip.innerHTML = "<strong>はじめる前</strong>";
        }else if(state.screen === "question"){
          const done = state.answers.filter(v => v !== null).length;
          topChip.innerHTML = `<strong>${done}</strong> / ${QUESTIONS.length}`;
        }else{
          topChip.innerHTML = "<strong>結果</strong>";
        }
      }

      function goStart(){
        state.screen = "start";
        state.index = 0;
        saveState();
        render();
      }

      function startCheck(){
        state.screen = "question";
        state.startedAt = state.startedAt || new Date().toISOString();
        const firstNull = state.answers.findIndex(v => v === null);
        state.index = firstNull === -1 ? 0 : firstNull;
        saveState();
        render(true);
      }

      function answerCurrent(value){
        state.answers[state.index] = value;
        if(state.index < QUESTIONS.length - 1){
          state.index += 1;
          saveState();
          render(true);
        }else{
          if(state.answers.every(v => v !== null)){
            state.screen = "result";
            saveState();
            render(true);
          }else{
            const firstNull = state.answers.findIndex(v => v === null);
            state.index = firstNull === -1 ? QUESTIONS.length - 1 : firstNull;
            saveState();
            render(true);
          }
        }
      }

      function back(){
        if(state.screen !== "question") return;
        if(state.index > 0){
          state.index -= 1;
          saveState();
          render(true);
        }else{
          state.screen = "start";
          saveState();
          render(true);
        }
      }

      function restart(){
        state.screen = "start";
        state.index = 0;
        state.answers = new Array(QUESTIONS.length).fill(null);
        state.startedAt = null;
        clearState();
        render(true);
      }

      function computeScores(answers){
        const domainScores = { house:0, isolation:0, life:0, health:0, money:0, ending:0 };
        let total = 0;

        for(let i=0;i<QUESTIONS.length;i++){
          const a = answers[i] === 1 ? 1 : 0;
          total += a;
          domainScores[QUESTIONS[i].domain] += a;
        }

        const domainMax = { house:5, isolation:5, life:5, health:5, money:5, ending:5 };

        const weighted = Object.keys(domainScores).reduce((acc,k)=>{
          const w = DOMAIN_META[k].weight || 1.0;
          acc[k] = domainScores[k] * w;
          return acc;
        }, {});

        return { total, domainScores, domainMax, weighted };
      }

      function getStateLabel(total){
        if(total <= 3) return { label:"今はおおむね安心", tone:"good", color:"#2F855A" };
        if(total <= 7) return { label:"少し気になるところあり", tone:"mild", color:"#2B6CB0" };
        if(total <= 12) return { label:"見直しのタイミング", tone:"watch", color:"#B7791F" };
        return { label:"早めに動こう（相談も選択肢）", tone:"act", color:"#9B2C2C" };
      }

      function getConcernAreas(scoreModel){
        const { domainScores, domainMax, weighted } = scoreModel;

        const list = Object.keys(domainScores).map(k=>{
          const raw = domainScores[k];
          const max = domainMax[k];
          const ratio = max ? (raw / max) : 0;
          return {
            key: k,
            name: DOMAIN_META[k].name,
            score: raw,
            max,
            ratio,
            weighted: weighted[k] || raw,
            desc: DOMAIN_META[k].desc
          };
        });

        const concerns = list
          .filter(x => x.score > 0)
          .sort((a,b)=>{
            if(b.score !== a.score) return b.score - a.score;
            return (b.weighted - a.weighted);
          });

        const allSorted = list.sort((a,b)=>{
          if(b.score !== a.score) return b.score - a.score;
          return (b.weighted - a.weighted);
        });

        return { concerns, allSorted };
      }

      function buildLikelyChanges(concerns, total){
        const top = concerns.slice(0, 3).map(x => x.key);

        const changes = [];

        if(top.length === 0){
          changes.push("小さな困りごとがあっても、早めに気づけるため、暮らしと住まいが安定しやすい状態です。");
          changes.push("ただ、体調や家のことは、季節や年齢で変わります。気になった時に「相談してよい」と覚えておくことが大切です。");
          return changes;
        }

        if(top.includes("house")){
          changes.push("家の片付けや修繕を後回しにしやすくなり、気づいた時に負担が大きくなることがあります。");
          changes.push("「この家を将来どうするか」の話し合いが遅れると、急な入院などの時に家族が迷いやすくなります。");
        }
        if(top.includes("isolation")){
          changes.push("困りごとがあっても周りに伝わりにくくなり、一人で抱え込みやすくなることがあります。");
          changes.push("体調の変化があった時に、連絡や手助けが遅れやすくなります。");
        }
        if(top.includes("health")){
          changes.push("疲れやすさや食事・物忘れが重なると、家事や外出が少しずつしんどくなることがあります。");
          changes.push("薬の管理が難しくなると、体調の波が出やすくなることがあります。");
        }
        if(top.includes("life")){
          changes.push("家事や外出が減ると、生活のリズムが崩れやすく、家の中の安全（つまずき等）も気になりやすくなります。");
        }
        if(top.includes("money")){
          changes.push("支払い管理や将来費用の不安があると、修繕やサービス利用の判断が先送りになりやすくなります。");
          changes.push("電話や訪問などの“お金のトラブル”に対して不安が強くなることがあります。");
        }
        if(top.includes("ending")){
          changes.push("連絡先や希望の共有がないと、いざという時に家族や支援者が動きにくくなることがあります。");
          changes.push("荷物の整理が進まないと、将来の住まいの選択肢が狭まりやすくなります。");
        }

        if(total >= 13){
          changes.push("いくつかの分野が重なって見えているので、「住まいだけ」の問題として抱えず、状況を一度いっしょに整理すると安心につながりやすいです。");
        }else if(total >= 8){
          changes.push("今は「小さな変化」が見えている段階です。ここで動けると、後から楽になることが多いです。");
        }else{
          changes.push("変化はまだ小さいかもしれませんが、気づけたこと自体が大切です。小さな一歩が、暮らしと住まいを守ります。");
        }

        return dedupeAndTrim(changes, 6);
      }

      function buildFirstSteps(concerns, total){
        const top = concerns.slice(0, 3).map(x => x.key);
        const steps = [];

        steps.push("気になったことを、1つだけでよいので紙に書いて、目につくところに置いておく（忘れない工夫）。");

        if(top.includes("isolation")){
          steps.push("「第一連絡先」になってくれそうな人へ、短い電話やLINEを1本だけ入れてみる。");
        }

        if(top.includes("health")){
          steps.push("薬や通院のことをメモにまとめる（薬の名前が分からなくても、病院名だけでもOK）。");
        }

        if(top.includes("house")){
          steps.push("家の書類（権利証・境界・保険など）の置き場所を、家族か信頼できる人に1回だけ伝える。");
        }

        if(top.includes("money")){
          steps.push("通帳・印鑑・支払い関係を“ひとまとめ”にして、場所を決める（必要なら誰かに一緒にやってもらう）。");
        }

        if(top.includes("ending")){
          steps.push("急なときの連絡先と希望（例：病院・介護・家のこと）を、短いメモでよいので作っておく。");
        }

        if(top.includes("life")){
          steps.push("家の中の「つまずきやすい場所」を1か所だけ見直す（段差・足元・照明など）。");
        }

        if(total >= 13){
          steps.unshift("一人で抱え込まず、まずは相談センターに「チェックで気になる所があった」と伝えてみる。");
        }else if(total >= 8){
          steps.unshift("相談は早いほどラクになります。まずは電話で「状況を整理したい」と伝えてみる。");
        }else{
          steps.push("今のうちに「相談してよい場所」を知っておく（困った時の安心材料）。");
        }

        const finalSteps = [];
        for(const s of steps){
          if(finalSteps.length >= 3) break;
          if(!finalSteps.includes(s)) finalSteps.push(s);
        }
        return finalSteps;
      }

      function buildNowStateMessage(stateLabel, total){
        const base = [];
        base.push("いま大切なのは、点数そのものではなく「変化に早く気づくこと」です。");
        base.push("空き家は突然生まれるのではなく、住まいだけでなく、健康・孤立・生活機能・お金・終活などの変化が重なって、少しずつ起きやすくなります。");
        if(total === 0){
          base.push("今回は「はい」がありませんでした。今の習慣が保てているのは、とても良いことです。");
        }else if(total <= 7){
          base.push("気になるところは、まだ小さい段階かもしれません。今のうちに整えると、先々がぐっと楽になります。");
        }else if(total <= 12){
          base.push("いくつかの分野で変化が見えています。できるところから順番に、暮らしを整えていきましょう。");
        }else{
          base.push("複数の分野が重なって見えています。心配を増やすためではなく、早めに状況を整理して、暮らしと住まいを守りやすくするためのサインと受け止めてください。");
        }
        base.push("必要に応じて、社会福祉士等が状況整理のハブとなり、地域包括支援センターなどとつながることで、多職種と一緒に考えやすくなります。");
        return base;
      }

      function buildConsultMessage(){
        const m = [];
        m.push("どこに相談すればいいか分からない時も、ここからで大丈夫です。");
        m.push("話をしながら状況を整理すると、住まいと暮らしを守りやすくなり、空き家予防にもつながります。");
        return m;
      }

      function generateResultModel(answers){
        const scoreModel = computeScores(answers);
        const stateLabel = getStateLabel(scoreModel.total);
        const { concerns, allSorted } = getConcernAreas(scoreModel);

        const nowStateMessage = buildNowStateMessage(stateLabel, scoreModel.total);
        const likelyChanges = buildLikelyChanges(concerns, scoreModel.total);
        const firstSteps = buildFirstSteps(concerns, scoreModel.total);
        const consultMessage = buildConsultMessage();

        return {
          scoreModel,
          stateLabel,
          concerns,
          allSorted,
          nowStateMessage,
          likelyChanges,
          firstSteps,
          consultMessage
        };
      }

      function dedupeAndTrim(arr, maxLen){
        const out = [];
        for(const s of arr){
          const t = String(s).trim();
          if(!t) continue;
          if(out.includes(t)) continue;
          out.push(t);
          if(out.length >= maxLen) break;
        }
        return out;
      }

      let swipeAttached = false;
      function attachSwipeBack(){
        if(swipeAttached) return;
        swipeAttached = true;

        let startX = 0, startY = 0, started = false;

        document.addEventListener("touchstart", (e)=>{
          if(state.screen !== "question") return;
          if(!e.touches || e.touches.length !== 1) return;
          const t = e.touches[0];
          startX = t.clientX;
          startY = t.clientY;
          started = true;
        }, { passive:true });

        document.addEventListener("touchend", (e)=>{
          if(state.screen !== "question") return;
          if(!started) return;
          started = false;
          if(!e.changedTouches || e.changedTouches.length !== 1) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - startX;
          const dy = t.clientY - startY;

          if(startX <= 28 && dx >= 80 && Math.abs(dy) <= 55){
            back();
          }
        }, { passive:true });
      }

      loadState();
      updateTopChip();
      render(false);
    })();
  </script>
</body>
</html>
